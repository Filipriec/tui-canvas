[package]
name = "tui-canvas"
version.workspace = true
edition.workspace = true
license = "MIT"
authors.workspace = true
description = "Form/textarea for TUI"
readme.workspace = true
repository.workspace = true
categories.workspace = true

[dependencies]
ratatui = { workspace = true, optional = true }
crossterm = { workspace = true, optional = true }
anyhow.workspace = true
tokio = { workspace = true, optional = true }
toml = { workspace = true }
serde.workspace = true
unicode-width.workspace = true
thiserror = { workspace = true }

tracing = "0.1.41"
tracing-subscriber = "0.3.19"
async-trait.workspace = true
regex = { workspace = true, optional = true }
ropey = { version = "1.6.1", optional = true }
once_cell = "1.21.3"
syntect = { version = "5.2.0", optional = true, default-features = false, features = ["default-fancy"] }
derivative = "2.2.0"
validation-core = { path = "tui-canvas-validation-core", package = "tui-canvas-validation-core", version = "0.7.5", optional = true }
arboard = { version = "3.4", optional = true }

[dev-dependencies]
tokio-test = "0.4.4"

[features]
default = ["textmode-vim", "clipboard"]
gui = ["ratatui", "crossterm"]
suggestions = ["tokio"]
cursor-style = ["crossterm"]
validation = ["regex", "validation-core", "validation-core/regex"]
computed = []
textarea = ["dep:ropey","gui"]
textinput = ["gui"]
commandline = ["textinput"]
syntect = ["dep:syntect", "gui", "textarea"]
keybindings = ["gui"]
# Mirror yanks into the OS clipboard: native via `arboard`, OSC 52 as fallback.
clipboard = ["dep:arboard"]

# text modes (mutually exclusive; default to vim)
textmode-vim = []
textmode-normal = []

full = [
    "gui",
    "suggestions",
    "cursor-style",
    "validation",
    "computed",
    "textarea",
    "textinput",
    "commandline",
    "keybindings",
    "clipboard"
]

[[example]]
name = "canvas_cursor_auto"
required-features = ["gui", "cursor-style"]
path = "examples/canvas_cursor_auto.rs"

[[example]]
name = "canvas_keybindings"
required-features = ["gui", "keybindings", "cursor-style"]
path = "examples/canvas_keybindings.rs"

[[example]]
name = "computed_fields"
required-features = ["gui", "computed"]

[[example]]
name = "validation_1"
required-features = ["gui", "validation", "cursor-style"]
path = "examples/validation/validation_1.rs"

[[example]]
name = "validation_2"
required-features = ["gui", "validation", "cursor-style"]
path = "examples/validation/validation_2.rs"

[[example]]
name = "validation_3"
required-features = ["gui", "validation", "cursor-style"]
path = "examples/validation/validation_3.rs"

[[example]]
name = "validation_4"
required-features = ["gui", "validation", "cursor-style"]
path = "examples/validation/validation_4.rs"

[[example]]
name = "validation_5"
required-features = ["gui", "validation", "cursor-style"]
path = "examples/validation/validation_5.rs"

[[example]]
name = "suggestions"
required-features = ["suggestions", "gui", "cursor-style"]
path = "examples/suggestions/suggestions.rs"

[[example]]
name = "suggestions2"
required-features = ["suggestions", "gui", "cursor-style"]
path = "examples/suggestions/suggestions2.rs"

[[example]]
name = "textarea_vim"
required-features = ["gui", "cursor-style", "textarea", "textmode-vim"]
path = "examples/textarea/textarea_vim.rs"

[[example]]
name = "textarea_normal"
required-features = ["gui", "cursor-style", "textarea", "textmode-normal", "commandline"]
path = "examples/textarea/textarea_normal.rs"

[[example]]
name = "textarea_syntax"
required-features = ["gui", "cursor-style", "textarea", "textmode-normal", "syntect"]
path = "examples/textarea/textarea_syntax.rs"

[[example]]
name = "textinput_normal"
required-features = ["gui", "cursor-style", "textinput", "textmode-normal"]
path = "examples/textarea/textinput_normal.rs"

[[example]]
name = "undo_redo"
required-features = ["gui", "cursor-style", "textinput"]
